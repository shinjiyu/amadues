# ─────────────────────────────────────────────────────────────────
# WebChat 子路径反代 ── 追加到现有 server { ... } 块中。
#
# 前提（loginserver 同 origin 是 SSO 成立的关键）：
#   - HTTPS 终止（TLS 证书）
#   - 同 root 域 / 同 origin 上至少承载：
#       /login, /register, /_nuxt/*      → loginserver Nuxt 前端 (默认 127.0.0.1:3000)
#       /api/auth/*                       → loginserver Flask 后端 (默认 127.0.0.1:5001)
#       /webchat/                         → 本片段下面的反代
#
# Compose 中 webchat 默认端口：
#   chat-server: 127.0.0.1:8790
#   web-chat:    127.0.0.1:8791
# 若改了请同步替换。
# ─────────────────────────────────────────────────────────────────

# WebSocket upgrade 用的 map（如果 nginx 已有，删掉重复定义）
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 1) /webchat/api/ → chat-server REST（剥 /webchat/api 前缀）
location ^~ /webchat/api/ {
  proxy_pass         http://127.0.0.1:8790/;          # 结尾 `/` 决定剥前缀
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Cookie            $http_cookie;
  proxy_pass_request_headers on;
  proxy_read_timeout 75s;
}

# 2) /webchat/uploads/ → chat-server uploads
location ^~ /webchat/uploads/ {
  proxy_pass         http://127.0.0.1:8790/uploads/;
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Cookie            $http_cookie;
  proxy_pass_request_headers on;
  client_max_body_size 30m;
}

# 3) /webchat/ws → chat-server WebSocket
location = /webchat/ws {
  proxy_pass         http://127.0.0.1:8790/ws;
  proxy_http_version 1.1;
  proxy_set_header   Upgrade           $http_upgrade;
  proxy_set_header   Connection        $connection_upgrade;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Cookie            $http_cookie;
  proxy_pass_request_headers on;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# 4) /webchat/ → web-chat 静态站（SPA fallback 在容器内 nginx 里）
location ^~ /webchat/ {
  proxy_pass         http://127.0.0.1:8791/;
  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
}

# 5) /webchat 无尾斜杠时 301
location = /webchat {
  return 301 /webchat/;
}

# ─────────────────────────────────────────────────────────────────
# loginserver 同 origin 接入示例（如果你还没在主域下挂 loginserver）
# 把下面 location 放到同一 server { } 块即可。
