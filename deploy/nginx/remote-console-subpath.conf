# Remote Console 子路径反代 — 并入 kuroneko.chat HTTPS server { }
# 前提：docker-compose.prod.yml 默认端口
#   remote-console-server: 127.0.0.1:3003
#   remote-console-web:    127.0.0.1:8082
# SDK 静态文件目录：/opt/remote-console/client-sdk/dist/

# Web Console SPA
location ^~ /remote-console/ {
    proxy_pass         http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Auth + admin HTTP API（cookie 同源）
location ^~ /remote-console/api/ {
    proxy_pass         http://127.0.0.1:3003/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Cookie            $http_cookie;
    proxy_pass_request_headers on;
}

# WebSocket（SDK / Console / MCP）
location = /remote-console/ws {
    proxy_pass         http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Cookie            $http_cookie;
    proxy_pass_request_headers on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# SDK 静态文件（无需鉴权）
location ^~ /remote-console/sdk/ {
    alias /opt/remote-console/client-sdk/dist/;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "public, max-age=3600";
}
